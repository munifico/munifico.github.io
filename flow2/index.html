<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🐋 수급 무브 트래커 · flow2 PoC</title>
<style>
:root{--bg:#f7f8fa;--card:#fff;--fg:#1a1d23;--muted:#6b7280;--line:#e5e7eb;--up:#dc2626;--dn:#2563eb;--accent:#7c3aed}
[data-theme=dark]{--bg:#0f1115;--card:#1a1d23;--fg:#e5e7eb;--muted:#9ca3af;--line:#2d3138;--up:#f87171;--dn:#60a5fa;--accent:#a78bfa}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Malgun Gothic",sans-serif}

.hubnav{position:sticky;top:0;z-index:150;display:flex;gap:6px;overflow-x:auto;
 padding:8px 12px;background:var(--card,#fff);border-bottom:1px solid var(--line,#e5e7eb);
 -webkit-overflow-scrolling:touch;scrollbar-width:none}
.hubnav::-webkit-scrollbar{display:none}
.hubnav-item{flex:0 0 auto;padding:7px 13px;border-radius:9999px;font-size:13px;font-weight:600;
 color:var(--muted,#6b7280);text-decoration:none;border:1px solid var(--line,#e5e7eb);white-space:nowrap;
 transition:background .15s,color .15s}
.hubnav-item:hover{color:var(--fg,#1a1d23)}
.hubnav-item.active{background:var(--accent,#7c3aed);color:#fff;border-color:var(--accent,#7c3aed)}
.hubnav-item.active:hover{color:#fff}

header{padding:14px 16px 4px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:19px;margin:0}
.poc{font-size:11px;font-weight:700;padding:2px 9px;border-radius:9999px;background:rgba(124,58,237,.14);color:var(--accent)}
.toggle{margin-left:auto;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
.wrap{padding:8px 16px 48px;max-width:1000px;margin:0 auto}
.intro{color:var(--muted);font-size:12.5px;line-height:1.7;margin:6px 2px 10px}
.tabs{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}
.tabs button{font:inherit;font-size:13px;font-weight:600;padding:7px 14px;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:9999px;cursor:pointer}
.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.cols{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:780px){.cols{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px;overflow:hidden}
.col-title{font-size:13px;font-weight:700;padding:6px 6px 8px;display:flex;align-items:center;gap:6px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:8px 7px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;color:var(--muted);text-transform:uppercase;position:sticky;top:0;background:var(--card)}
th:first-child,td:first-child{text-align:left}
tr.stock{cursor:pointer}
tr.stock:hover td{background:rgba(124,58,237,.06)}
.nm{font-weight:600}.cd{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.mk{font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 5px;margin-left:5px}
.num{font-variant-numeric:tabular-nums}
.up{color:var(--up)}.dn{color:var(--dn)}.flat{color:var(--muted)}
.badge{font-size:11px;font-weight:700;padding:1px 7px;border-radius:9999px;background:rgba(220,38,38,.13);color:var(--up)}
.empty{color:var(--muted);text-align:center;padding:24px}
.note{color:var(--muted);font-size:11.5px;line-height:1.6;margin-top:10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:200;padding:16px}
.modal.on{display:flex}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:16px;max-width:520px;width:100%;padding:18px}
.sheet h3{margin:0 0 2px;font-size:17px}
.sheet .sub{color:var(--muted);font-size:12px;margin-bottom:14px}
.close{float:right;cursor:pointer;color:var(--muted);font-size:20px;line-height:1;border:none;background:none}
.bars{display:flex;flex-direction:column;gap:10px}
.bar-row{display:grid;grid-template-columns:54px 1fr 76px;align-items:center;gap:8px;font-size:13px}
.bar-lab{color:var(--muted);font-weight:600}
.bar-track{position:relative;height:18px;background:var(--line);border-radius:5px;overflow:hidden}
.bar-fill{position:absolute;top:0;height:100%;border-radius:5px}
.bar-fill.pos{background:var(--up);left:50%}
.bar-fill.neg{background:var(--dn);right:50%}
.bar-mid{position:absolute;left:50%;top:0;width:1px;height:100%;background:var(--muted);opacity:.4}
.bar-val{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.err{padding:30px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<nav class="hubnav"><a class="hubnav-item" href="../hub/">🏠 허브</a><a class="hubnav-item" href="../watch/">🎯 주도주</a><a class="hubnav-item" href="../thememap/">🗂️ 테마진입</a><a class="hubnav-item" href="../stock_summary/">📊 종목추세</a><a class="hubnav-item" href="../jensen/">🟢 젠슨황</a><a class="hubnav-item" href="../study/">📚 인사이트</a><a class="hubnav-item" href="../signal_dashboard/">📈 신호성과 🇰🇷</a><a class="hubnav-item" href="../us_dashboard/">📈 신호성과 🇺🇸</a><a class="hubnav-item" href="../investmap/">🗺️ 투자지도</a></nav>
<header>
  <h1>🐋 수급 무브 트래커</h1>
  <span class="poc">flow2 · PoC</span>
  <button class="toggle" id="themeBtn">🌙 다크</button>
</header>
<div class="wrap">
  <p class="intro" id="intro">불러오는 중…</p>
  <div class="tabs" id="invTabs"></div>
  <div class="cols">
    <div class="card"><div class="col-title">🟢 순매수 상위 <span class="cd" id="buyName"></span></div><div id="buyTbl"><div class="empty">…</div></div></div>
    <div class="card"><div class="col-title">🔴 순매도 상위 <span class="cd" id="sellName"></span></div><div id="sellTbl"><div class="empty">…</div></div></div>
  </div>
  <p class="note">⚠ <b>5일 누적 순매수 거래대금(억원)</b> 기준. 종목을 누르면 <b>5주체(외국인·투신·사모·연기금·개인)가 각각 얼마 사고/팔았는지</b> 한눈에 비교됩니다.
    <b>매수신호 아님 = 정보 추적</b>(외인·기관 따라사기는 백테 채택 미달, §106). 컨셉 검증용 PoC.</p>
</div>

<div class="modal" id="modal">
  <div class="sheet">
    <button class="close" id="mClose">×</button>
    <h3 id="mTitle"></h3>
    <div class="sub" id="mSub"></div>
    <div class="bars" id="mBars"></div>
  </div>
</div>

<script>
var DATA=null,INV="fore";
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function eok(v){if(v==null)return"–";var a=Math.abs(v);var s=a>=10000?(v/10000).toFixed(2)+"조":Math.round(v).toLocaleString()+"억";return(v>0?"+":(v<0?"−":""))+s}
function cls(v){return v>0?"up":(v<0?"dn":"flat")}

function applyThemeUI(){document.getElementById("themeBtn").textContent=document.documentElement.getAttribute("data-theme")==="dark"?"☀️ 라이트":"🌙 다크"}
if(localStorage.getItem("flow2_theme")==="dark")document.documentElement.setAttribute("data-theme","dark");
applyThemeUI();
document.getElementById("themeBtn").onclick=function(){var d=document.documentElement.getAttribute("data-theme")==="dark";
 document.documentElement.setAttribute("data-theme",d?"light":"dark");localStorage.setItem("flow2_theme",d?"light":"dark");applyThemeUI();};

function rowHtml(r){
 return '<tr class="stock" data-code="'+r.code+'"><td><span class="nm">'+esc(r.name)+'</span><span class="mk">'+esc(r.market)+'</span><br><span class="cd">'+r.code+'</span></td>'+
  '<td class="num '+cls(r.net5)+'">'+eok(r.net5)+'</td>'+
  '<td class="num '+cls(r.net1)+'">'+eok(r.net1)+'</td>'+
  '<td>'+(r.streak>=3?'<span class="badge">'+r.streak+'일</span>':'<span class="flat num">'+r.streak+'</span>')+'</td></tr>';
}
function fillTable(elId,list){
 var el=document.getElementById(elId);
 if(!list||!list.length){el.innerHTML='<div class="empty">데이터 없음</div>';return}
 el.innerHTML='<table><thead><tr><th>종목</th><th>5일누적</th><th>당일</th><th>연속</th></tr></thead><tbody>'+
  list.map(rowHtml).join("")+'</tbody></table>';
 el.querySelectorAll("tr.stock").forEach(function(tr){tr.onclick=function(){openDetail(tr.dataset.code)}});
}
function render(){
 if(!DATA)return;var d=DATA.inv[INV]||{buy:[],sell:[]};
 var lab=(DATA.investors.find(function(x){return x.key===INV})||{}).label||INV;
 document.getElementById("buyName").textContent="("+lab+")";
 document.getElementById("sellName").textContent="("+lab+")";
 fillTable("buyTbl",d.buy);fillTable("sellTbl",d.sell);
}

/* 종목 클릭 → 5주체 비교 바 */
function openDetail(code){
 var det=(DATA.detail||{})[code];if(!det)return;
 document.getElementById("mTitle").innerHTML=esc(det.name)+' <span class="cd">'+code+'</span> <span class="mk">'+esc(det.market)+'</span>';
 document.getElementById("mSub").textContent="5주체 "+DATA.window+"일 누적 순매수(억원) · "+DATA.win_start+"~"+DATA.asof;
 var vals=DATA.investors.map(function(iv){return {label:iv.label,v:det.byinv5[iv.key]||0}});
 var mx=Math.max.apply(null,vals.map(function(x){return Math.abs(x.v)}))||1;
 document.getElementById("mBars").innerHTML=vals.map(function(x){
  var w=Math.min(50,Math.abs(x.v)/mx*50);
  var fill=x.v>=0?'<div class="bar-fill pos" style="width:'+w+'%"></div>':'<div class="bar-fill neg" style="width:'+w+'%"></div>';
  return '<div class="bar-row"><span class="bar-lab">'+esc(x.label)+'</span>'+
   '<div class="bar-track"><div class="bar-mid"></div>'+fill+'</div>'+
   '<span class="bar-val '+cls(x.v)+'">'+eok(x.v)+'</span></div>';
 }).join("");
 document.getElementById("modal").classList.add("on");
}
document.getElementById("mClose").onclick=function(){document.getElementById("modal").classList.remove("on")};
document.getElementById("modal").onclick=function(e){if(e.target.id==="modal")this.classList.remove("on")};

fetch("data.json?_="+Date.now()).then(function(r){return r.json()}).then(function(j){
 DATA=j;
 document.getElementById("invTabs").innerHTML=j.investors.map(function(iv,i){
  return '<button data-k="'+iv.key+'"'+(i===0?' class="on"':'')+'>'+iv.label+'</button>';
 }).join("");
 document.querySelectorAll("#invTabs button").forEach(function(b){b.onclick=function(){
  document.querySelectorAll("#invTabs button").forEach(function(x){x.classList.remove("on")});b.classList.add("on");INV=b.dataset.k;render();
 }});
 document.getElementById("intro").innerHTML='기준일 <b>'+j.asof+'</b> · 최근 <b>'+j.window+'거래일 누적 순매수</b>('+j.win_start+'~'+j.asof+'). 투자자를 고르면 순매수/순매도 상위가 양쪽에 보이고, 종목을 누르면 5주체 비교가 나옵니다.';
 render();
}).catch(function(e){document.getElementById("buyTbl").innerHTML='<div class="err">data.json 로드 실패 — http 로 열어주세요. '+e+'</div>'});
</script>
</body>
</html>
