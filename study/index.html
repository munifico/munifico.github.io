<!doctype html><html lang="ko" data-theme="light"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>📚 인사이트 노트</title>
<style>
:root{--bg:#f7f8fa;--card:#fff;--fg:#1a1d23;--mut:#6b7280;--line:#e5e7eb;--acc:#7c3aed;--pos:#dc2626;--neg:#2563eb}
[data-theme=dark]{--bg:#0f1115;--card:#1a1d23;--fg:#e5e7eb;--mut:#9ca3af;--line:#2d3138;--acc:#a78bfa;--pos:#f87171;--neg:#60a5fa}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Malgun Gothic",sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:16px}
.head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px}
h1{font-size:20px;margin:6px 0}.sub{color:var(--mut);font-size:12px}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;padding:6px 11px;font-size:13px}
.spacer{margin-left:auto}
.search input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--fg);font-size:14px;margin:10px 0}
.list{display:flex;flex-direction:column;gap:10px}
.ncard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 16px;cursor:pointer}
.ncard:hover{border-color:var(--acc)}
.ncard .q{font-weight:700;font-size:15px}
.ncard .meta{color:var(--mut);font-size:12px;margin-top:4px}
.tag{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:11px;margin:2px 3px 0 0}
.note{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 24px;display:none}
.note.on{display:block}
.note h1{font-size:21px;border-bottom:2px solid var(--acc);padding-bottom:8px}
.note h2{font-size:17px;margin-top:22px;color:var(--acc)}
.note h3{font-size:15px;margin-top:16px}
.note p{margin:8px 0}.note ul,.note ol{margin:8px 0;padding-left:22px}.note li{margin:3px 0}
.note code{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:13px}
.note pre{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;overflow:auto;line-height:1.5}
.note pre code{border:0;background:none;padding:0}
.note blockquote{border-left:3px solid var(--acc);margin:10px 0;padding:4px 14px;color:var(--mut);background:var(--bg);border-radius:0 8px 8px 0}
.note hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.note table{border-collapse:collapse;margin:14px 0;width:100%;font-size:13px;display:block;overflow-x:auto}
.note th,.note td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
.note thead th{background:var(--bg);font-weight:600}
.note tbody tr:nth-child(even){background:var(--bg)}
.note a{color:var(--acc)}
.back{cursor:pointer;color:var(--acc);font-size:13px;margin-bottom:10px;display:inline-block}
.empty{color:var(--mut);text-align:center;padding:40px}
</style><style>
.hubnav{position:sticky;top:0;z-index:150;display:flex;gap:6px;overflow-x:auto;
 padding:8px 12px;background:var(--card,#fff);border-bottom:1px solid var(--line,#e5e7eb);
 -webkit-overflow-scrolling:touch;scrollbar-width:none}
.hubnav::-webkit-scrollbar{display:none}
.hubnav-item{flex:0 0 auto;padding:7px 13px;border-radius:9999px;font-size:13px;font-weight:600;
 color:var(--muted,#6b7280);text-decoration:none;border:1px solid var(--line,#e5e7eb);white-space:nowrap;
 transition:background .15s,color .15s}
.hubnav-item:hover{color:var(--fg,#1a1d23)}
.hubnav-item.active{background:var(--accent,#7c3aed);color:#fff;border-color:var(--accent,#7c3aed)}
.hubnav-item.active:hover{color:#fff}
</style>
</head><body>
<nav class="hubnav"><a class="hubnav-item" href="../hub/">🏠 허브</a><a class="hubnav-item" href="../watch/">🎯 주도주</a><a class="hubnav-item" href="../thememap/">🗂️ 테마진입</a><a class="hubnav-item" href="../stock_summary/">📊 종목추세</a><a class="hubnav-item" href="../jensen/">🟢 젠슨황</a><a class="hubnav-item active" href="../study/">📚 인사이트</a><a class="hubnav-item" href="../signal_dashboard/">📈 신호성과 🇰🇷</a><a class="hubnav-item" href="../us_dashboard/">📈 신호성과 🇺🇸</a><a class="hubnav-item" href="../flow2/">🐋 수급무브</a><a class="hubnav-item" href="../investmap/">🗺️ 투자지도</a></nav>
<div class="wrap">
<div class="head">
  <h1>📚 인사이트 노트 <span class="sub" id="gen"></span></h1>
  <button class="btn spacer" id="themeBtn">🌙</button>
</div>
<p class="sub">Top-Down 인과 학습 아카이브 — "왜?"를 끝까지 캐물어 정리. 🔬 검증 포인트 = 읽은 걸 그대로 믿지 않는 우리 시그니처.</p>
<div class="search"><input id="q" type="text" placeholder="🔍 질문·제목·태그 검색"></div>
<div class="list" id="list"></div>
<div class="note" id="note"></div>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const tb=$("#themeBtn");
function setTh(t){document.documentElement.setAttribute("data-theme",t);tb.textContent=t==="dark"?"☀️":"🌙";localStorage.setItem("theme",t);}
setTh(localStorage.getItem("theme")||"light");
tb.onclick=()=>setTh(document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark");
let NOTES=[];
fetch("data.json?_="+Date.now()).then(r=>r.json()).then(d=>{
 NOTES=d.notes||[];$("#gen").textContent="· "+d.generated+" · "+NOTES.length+"편";
 renderList();
 if(location.hash)open(location.hash.slice(1));
});
function renderList(){
 const v=$("#q").value.trim().toLowerCase();
 const arr=NOTES.filter(n=>!v||(n.question+n.title+(n.tags||[]).join()).toLowerCase().includes(v));
 $("#note").classList.remove("on");$("#list").style.display="flex";
 $("#list").innerHTML=arr.map(n=>'<div class="ncard" data-slug="'+esc(n.slug)+'">'+
   '<div class="q">❓ '+esc(n.question||n.title)+'</div>'+
   '<div class="meta">'+esc(n.date)+' · '+esc(n.title)+' '+(n.tags||[]).map(t=>'<span class="tag">'+esc(t)+'</span>').join("")+'</div></div>').join("")
   ||'<div class="empty">아직 노트가 없습니다.</div>';
 document.querySelectorAll(".ncard").forEach(c=>c.onclick=()=>open(c.dataset.slug));
}
function open(slug){
 const n=NOTES.find(x=>x.slug===slug);if(!n)return;
 location.hash=slug;
 $("#list").style.display="none";
 const el=$("#note");el.classList.add("on");
 el.innerHTML='<span class="back" id="back">← 목록</span>'+n.html+
   '<hr><p class="sub">'+esc(n.date)+(n.tags||[]).map(t=>' <span class="tag">'+esc(t)+'</span>').join("")+'</p>';
 $("#back").onclick=()=>{history.replaceState(null,"",location.pathname);renderList();window.scrollTo(0,0);};
 window.scrollTo(0,0);
}
$("#q").addEventListener("input",renderList);
window.addEventListener("hashchange",()=>{if(!location.hash)renderList();});
</script></body></html>
